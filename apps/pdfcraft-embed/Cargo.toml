[package]
name = "pdfcraft-embed"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "PdfCraft as a library Workbench hosts natively in its side panel (craft-embed)"
publish = false

[lib]
crate-type = ["cdylib"]

[lints]
workspace = true

[dependencies]
pdfcraft-ui-egui = { workspace = true }
# `PdfCraftApp` is driven through `eframe::App`; the host supplies an empty `Frame`.
eframe = { workspace = true, features = ["wgpu", "glow", "accesskit", "persistence", "links", "clipboard"] }
egui = { workspace = true }
serde_json = { workspace = true }
craft-embed = { path = "../../../../crates/craft-embed" }
